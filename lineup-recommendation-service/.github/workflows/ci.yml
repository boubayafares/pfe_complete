name: lineup-recommendation-service CI

on:
  push:
    paths:
      - "lineup-recommendation-service/**"
  pull_request:
    paths:
      - "lineup-recommendation-service/**"

defaults:
  run:
    working-directory: lineup-recommendation-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: lineup-recommendation-service/requirements-runtime.txt

      - name: Install runtime + test dependencies
        run: |
          pip install -r requirements-runtime.txt
          pip install pytest httpx

      - name: Run tests (couche domaine + API — pas de dépendance StatsBomb/socceraction ici)
        run: pytest -v

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t foottech/lineup-recommendation-service:${{ github.sha }} .
        working-directory: lineup-recommendation-service
