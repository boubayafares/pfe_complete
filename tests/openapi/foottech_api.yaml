components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token returned by the login endpoint
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        env:
          type: string
          example: development
        timestamp:
          type: string
          format: date-time
          example: '2024-11-01T10:00:00.000Z'

    Error:
      type: object
      properties:
        message:
          type: string
        statusCode:
          type: integer
        errors:
          type: array
          items:
            type: object

    RegisterCoachRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: coach@test.com
        password:
          type: string
          format: password
          example: Test1234!
        phone:
          type: string
          example: +33612345678
        clubName:
          type: string
          example: FootTech FC

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: coach@test.com
        password:
          type: string
          format: password
          example: Test1234!

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: JWT bearer token
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Token validity in seconds

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [COACH, ADJOINT, JOUEUR]
        avatarUrl:
          type: string
          nullable: true
        teamId:
          type: string
          format: uuid
          nullable: true

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: U15 A
        category:
          type: string
          example: U15
        logoUrl:
          type: string
          nullable: true
        coachId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: U15 A
        category:
          type: string
          example: U15
        logoUrl:
          type: string

    AddStaffRequest:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    Player:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        position:
          type: string
        teamId:
          type: string
          format: uuid
        jerseyNumber:
          type: integer
        phone:
          type: string
        photoUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INJURED, INACTIVE]
        createdAt:
          type: string
          format: date-time

    CreatePlayerRequest:
      type: object
      required: [firstName, lastName, dateOfBirth, teamId]
      properties:
        firstName:
          type: string
          example: Lucas
        lastName:
          type: string
          example: Martin
        dateOfBirth:
          type: string
          format: date
          example: '2012-05-14'
        position:
          type: string
          example: Attaquant
        teamId:
          type: string
          format: uuid
        jerseyNumber:
          type: integer
          example: 9
        phone:
          type: string
        photoUrl:
          type: string

    Guardian:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        relation:
          type: string
          example: Père
        phone:
          type: string
        email:
          type: string
          format: email

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string
