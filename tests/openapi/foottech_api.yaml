components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token returned by the login endpoint
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        env:
          type: string
          example: development
        timestamp:
          type: string
          format: date-time
          example: '2024-11-01T10:00:00.000Z'

    Error:
      type: object
      properties:
        message:
          type: string
        statusCode:
          type: integer
        errors:
          type: array
          items:
            type: object

    RegisterCoachRequest:
      type: object
      required: [firstName, lastName, phone, email, password]
      properties:
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: coach@test.com
        password:
          type: string
          format: password
          example: Test1234!
        phone:
          type: string
          example: +33612345678

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: coach@test.com
        password:
          type: string
          format: password
          example: Test1234!

    AuthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          oneOf:
            - type: object
              required: [user, tokens]
              properties:
                user:
                  $ref: '#/components/schemas/User'
                tokens:
                  $ref: '#/components/schemas/AuthTokens'
            - type: object
              required: [user, needsActivation]
              properties:
                user:
                  $ref: '#/components/schemas/User'
                needsActivation:
                  type: boolean
                  const: true

    TokenRefreshResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        message:
