openapi: 3.1.0
info:
  title: FootTech API
  description: |
    FootTech is a football team management platform for coaches, assistants (adjoint)
    and players (joueur). This specification documents the main REST endpoints of the
    backend Express service.

    The API is versioned under `/api/v1`. All protected endpoints require a Bearer JWT.
    Successful JSON responses use the envelope `{ success: true, message?, data,
    pagination? }`; resource schemas below describe the value carried in `data` unless
    an endpoint documents the complete envelope explicitly.
  version: 2.0.0
servers:
  - url: http://localhost:4000
    description: Local backend (Express)
tags:
  - name: Health
    description: Service health checks
  - name: Auth
    description: Authentication endpoints
  - name: Teams
    description: Team management
  - name: Players
    description: Player management
  - name: Matches
    description: Match management
  - name: Trainings
    description: Training session management
  - name: Notifications
    description: Notification management
  - name: Attendance
    description: Training attendance management
  - name: Seasons
    description: Season catalogue management
  - name: Weekly Plannings
    description: Team-scoped weekly planning management
  - name: AI Insights
    description: Team-scoped artificial intelligence insights
paths:
  /health:
    get:
      tags:
        - Health
      summary: Service health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                timestamp: '2024-11-01T10:00:00.000Z'

  /api/v1/auth/register-coach:
    post:
      tags:
        - Auth
      summary: Register a new coach account
      operationId: registerCoach
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCoachRequest'
            example:
              firstName: John
              lastName: Doe
              email: coach@test.com
              password: Test1234!
              phone: '+33612345678'
      responses:
        '201':
          description: Coach created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already registered

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate a coach or adjoint
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: coach@test.com
              password: Test1234!
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid credentials
        '429':
          description: Too many requests (rate limited)

  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh an access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  description: The refresh token issued at login
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke the current session
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All refresh tokens for the authenticated user were revoked

  /api/v1/auth/select-team:
    post:
      tags: [Auth]
      summary: Select an accessible team and rotate the JWT pair
      operationId: selectActiveTeam
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties:
                teamId:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Active team selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: The authenticated user cannot access this team

  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Get current authenticated user
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated

  /api/v1/teams:
    get:
      tags:
        - Teams
      summary: List teams for the authenticated user
      operationId: listTeams
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Not authenticated
    post:
      tags:
        - Teams
      summary: Create a new team (COACH only)
      operationId: createTeam
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
            example:
              name: U15 A
              category: U15
              logo: https://example.test/logo.png
              description: Équipe U15
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '403':
          description: Requires COACH role

  /api/v1/teams/{id}:
    get:
      tags:
        - Teams
      summary: Get a team by ID
      operationId: getTeam
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          description: Team not found
    patch:
      tags:
        - Teams
      summary: Update a team (COACH only)
      operationId: updateTeam
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: string
                logo:
                  type: string
                  format: uri
                description:
                  type: string
      responses:
        '200':
          description: Team updated
    delete:
      tags:
        - Teams
      summary: Delete a team (COACH only)
      operationId: deleteTeam
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Team deleted

  /api/v1/teams/{id}/staff:
    post:
      tags:
        - Teams
      summary: Add an adjoint to a team (COACH only)
      operationId: addTeamStaff
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddStaffRequest'
      responses:
        '201':
          description: Staff added

  /api/v1/players:
    get:
      tags:
        - Players
      summary: List players
      operationId: listPlayers
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: posteP
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of players
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Player'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Not authenticated
    post:
      tags:
        - Players
      summary: Create a new player (COACH/ADJOINT)
      operationId: createPlayer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerRequest'
            example:
              firstName: Lucas
              lastName: Martin
              dateNaissance: '2012-05-14'
              posteP: FW
              piedFort: DROIT
              numeroMaillot: 9
              phone: '+33611112222'
      responses:
        '201':
          description: Player created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'

  /api/v1/players/{id}:
    get:
      tags:
        - Players
      summary: Get a player's full profile
      operationId: getPlayer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Player profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '404':
          description: Player not found
    patch:
      tags:
        - Players
      summary: Update a player (COACH/ADJOINT)
      operationId: updatePlayer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dateNaissance:
                  type: string
                  format: date
                tailleCm:
                  type: number
                poidsKg:
                  type: number
                posteP:
                  type: string
                posteS:
                  type: string
                piedFort:
                  type: string
                  enum: [DROIT, GAUCHE, AMBIDEXTRE]
                numeroMaillot:
                  type: integer
      responses:
        '200':
          description: Player updated

  /api/v1/players/{id}/guardians:
    get:
      tags:
        - Players
      summary: List guardians of a player
      operationId: listGuardians
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Player guardians
    put:
      tags:
        - Players
      summary: Create or update a guardian (COACH/ADJOINT)
      operationId: upsertGuardian
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Guardian'
      responses:
        '200':
          description: Guardian saved

  /api/v1/players/{id}/address:
    get:
      tags:
        - Players
      summary: Get player address
      operationId: getPlayerAddress
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Player address
    put:
      tags:
        - Players
      summary: Create or update player address (COACH/ADJOINT)
      operationId: upsertPlayerAddress
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: Address saved

  /api/v1/players/{id}/school-info:
    get:
      tags:
        - Players
      summary: Get player school information
      operationId: getPlayerSchoolInfo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: School information
    put:
      tags:
        - Players
      summary: Create or update school info (COACH/ADJOINT)
      operationId: upsertSchoolInfo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolInfo'
      responses:
        '200':
          description: School info saved

  /api/v1/players/{id}/season-profile:
    get:
      tags:
        - Players
      summary: List season profiles of a player
      operationId: listPlayerSeasonProfiles
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Season profiles
    put:
      tags:
        - Players
      summary: Create or update season profile (COACH/ADJOINT)
      operationId: upsertSeasonProfile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonProfile'
      responses:
        '200':
          description: Season profile saved

  /api/v1/players/{id}/injuries:
    get:
      tags:
        - Players
      summary: List injuries of a player
      operationId: listPlayerInjuries
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Player injuries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Injury'
    post:
      tags:
        - Players
      summary: Record a new injury (COACH/ADJOINT)
      operationId: createPlayerInjury
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInjuryRequest'
      responses:
        '201':
          description: Injury recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Injury'

  /api/v1/players/{id}/injuries/{injuryId}:
    patch:
      tags:
        - Players
      summary: Update an injury (COACH/ADJOINT)
      operationId: updateInjury
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: injuryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [ACTIVE, RECOVERED]
                severity:
                  type: string
                  enum: [MILD, MODERATE, SEVERE]
                recoveryDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Injury updated
    delete:
      tags:
        - Players
      summary: Delete an injury (COACH/ADJOINT)
      operationId: deleteInjury
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: injuryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Injury deleted

  /api/v1/seasons:
    get:
      tags: [Seasons]
      summary: List seasons
      description: Lists seasons owned by the selected team plus read-only legacy shared seasons.
      operationId: listSeasons
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Season list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonListResponse'
    post:
      tags: [Seasons]
      summary: Create a season (COACH)
      description: Creates the season for the team selected in the authenticated session.
      operationId: createSeason
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeasonRequest'
      responses:
        '201':
          description: Season created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'

  /api/v1/seasons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Seasons]
      summary: Get a season
      operationId: getSeason
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Season details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'
    patch:
      tags: [Seasons]
      summary: Partially update a season (COACH)
      operationId: updateSeason
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSeasonRequest'
      responses:
        '200':
          description: Season updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'
    delete:
      tags: [Seasons]
      summary: Delete a season (COACH)
      operationId: deleteSeason
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Season deleted

  /api/v1/weekly-plannings:
    get:
      tags: [Weekly Plannings]
      summary: List weekly plannings for the authenticated team
      operationId: listWeeklyPlannings
      security:
        - bearerAuth: []
      parameters:
        - name: seasonId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Weekly planning list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeeklyPlanning'
    post:
      tags: [Weekly Plannings]
      summary: Create a weekly planning (COACH/ADJOINT)
      operationId: createWeeklyPlanning
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWeeklyPlanningRequest'
      responses:
        '201':
          description: Weekly planning created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyPlanning'

  /api/v1/weekly-plannings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Weekly Plannings]
      summary: Get a weekly planning belonging to the authenticated team
      operationId: getWeeklyPlanning
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Weekly planning details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyPlanning'
    patch:
      tags: [Weekly Plannings]
      summary: Partially update a weekly planning (COACH/ADJOINT)
      operationId: updateWeeklyPlanning
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWeeklyPlanningRequest'
      responses:
        '200':
          description: Weekly planning updated
    delete:
      tags: [Weekly Plannings]
      summary: Delete a weekly planning (COACH)
      operationId: deleteWeeklyPlanning
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Weekly planning deleted

  /api/v1/weekly-plannings/{id}/slots:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Weekly Plannings]
      summary: List weekly planning slots
      operationId: listWeeklyPlanningSlots
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Slot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeeklyPlanningSlot'
    put:
      tags: [Weekly Plannings]
      summary: Create or update a weekly planning slot (COACH/ADJOINT)
      operationId: upsertWeeklyPlanningSlot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertWeeklyPlanningSlotRequest'
      responses:
        '200':
          description: Slot saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyPlanningSlot'

  /api/v1/matches:
    get:
      tags:
        - Matches
      summary: List matches
      operationId: listMatches
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [SCHEDULED, LIVE, FINISHED, CANCELLED, POSTPONED]
        - name: seasonId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of matches
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Match'
        '401':
          description: Not authenticated
    post:
      tags:
        - Matches
      summary: Create a new match (COACH/ADJOINT)
      operationId: createMatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatchRequest'
            example:
              adversaire: AS Romains
              dateHeure: '2027-11-10T18:00:00Z'
              lieu: Stade de Genève
              isHome: true
              formation: 4-3-3
              seasonId: 2
      responses:
        '201':
          description: Match created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'

  /api/v1/matches/{id}:
    get:
      tags:
        - Matches
      summary: Get a match by ID
      operationId: getMatch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Match details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '404':
          description: Match not found
    delete:
      tags:
        - Matches
      summary: Delete a match (COACH only)
      operationId: deleteMatch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Match deleted

  /api/v1/matches/{id}/status:
    patch:
      tags:
        - Matches
      summary: Update match status (COACH/ADJOINT)
      operationId: updateMatchStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
