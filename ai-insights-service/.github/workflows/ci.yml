name: ai-insights-service CI

on:
  push:
    paths:
      - "ai-insights-service/**"
  pull_request:
    paths:
      - "ai-insights-service/**"

defaults:
  run:
    working-directory: ai-insights-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-insights-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t foottech/ai-insights-service:${{ github.sha }} .
        working-directory: ai-insights-service
